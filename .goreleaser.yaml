version: 2

project_name: varve

before:
  hooks:
    - go mod tidy

builds:
  - id: varve
    main: ./cmd/varve
    binary: varve
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: varve
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  use: github
  sort: asc
  groups:
    - title: "New features"
      regexp: "^feat"
      order: 0
    - title: "Bug fixes"
      regexp: "^fix"
      order: 1
    - title: "Documentation"
      regexp: "^docs"
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "merge conflict"
      - "Merge pull request"

release:
  github:
    owner: varve-sh
    name: varve
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: varve
    # Prereleases do not publish a formula. Without this, tagging v2.0.0-rc.1
    # writes Formula/varve.rb pointing at the rc, so `brew install
    # varve-sh/tap/varve` hands a release candidate to anyone who asks for varve.
    # Consequence to know: the first Formula/varve.rb therefore appears on the
    # first STABLE tag, which is what the tap cutover waits on.
    skip_upload: auto
    repository:
      owner: varve-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://varve.sh
    description: "Decision memory for AI coding agents — local-first, MCP-native, one binary"
    license: Apache-2.0
    test: |
      system "#{bin}/varve", "--version"
    install: |
      bin.install "varve"
